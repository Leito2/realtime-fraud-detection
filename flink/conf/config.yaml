# Laptop profile (PLAN.md §3.3, §8). Keys verified against Flink 2.0 in M1 via REST /jobmanager/config.
jobmanager:
  rpc:
    address: jobmanager
  bind-host: 0.0.0.0
  memory:
    process:
      size: 750m              # 600m OOMed at job submit (M1 measurement, PLAN.md §8)
    jvm-metaspace:
      size: 128m
    off-heap:
      size: 64m
rest:
  address: jobmanager
  bind-address: 0.0.0.0
taskmanager:
  bind-host: 0.0.0.0
  host: taskmanager
  numberOfTaskSlots: 4
  memory:
    process:
      size: 1200m
heartbeat:
  interval: 2 s              # default 10 s; a killed TaskManager is noticed after `timeout`, not after TCP gives up (F1)
  timeout: 10 s              # default 50 s: the dominant part of the 78 s outage measured in F1 (see docs/resilience)
restart-strategy:
  type: fixed-delay
  fixed-delay:
    attempts: 2147483647
    delay: 1 s
parallelism:
  default: 2
execution:
  buffer-timeout: 5 ms          # default 100 ms — the biggest latency knob (experiment E3)
  checkpointing:
    interval: 10 s
    dir: file:///flink-checkpoints
pipeline:
  object-reuse: true
state:
  backend:
    type: rocksdb
    incremental: true
metrics:
  reporter:
    prom:
      factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      port: 9249
