[project]
name = "fraudcore"
version = "0.1.0"
description = "Shared feature definitions and event contracts (training, scorer, API) — the structural defense against train/serve skew."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudcore"]
