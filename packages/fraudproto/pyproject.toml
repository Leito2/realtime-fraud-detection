[project]
name = "fraudproto"
version = "0.1.0"
description = "Generated Python stubs of proto/fraud/v1/scoring.proto (regenerate with `make proto`)."
requires-python = ">=3.12"
dependencies = ["grpcio>=1.66", "protobuf>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]
