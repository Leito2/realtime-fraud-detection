[project]
name = "api"
version = "0.1.0"
description = "Admin & scoring API: reads decisions, explanations and features; POST /score arrives with M7c (PLAN.md 3.7)."
requires-python = ">=3.12"
dependencies = ["fraudcore", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2", "redis>=5",
    "mlflow-skinny>=3.0", "prometheus-client>=0.20", "httpx>=0.27"]

[project.scripts]
api = "api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
fraudcore = { workspace = true }
