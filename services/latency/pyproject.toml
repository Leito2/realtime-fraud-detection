[project]
name = "latency"
version = "0.1.0"
description = "Latency Collector: end-to-end percentiles from the decisions topic (PLAN.md §3.12)."
requires-python = ">=3.12"
dependencies = ["fraudcore", "confluent-kafka>=2.5", "hdrhistogram>=0.10", "orjson>=3.10"]

[project.scripts]
latency = "latency.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latency"]

[tool.uv.sources]
fraudcore = { workspace = true }
