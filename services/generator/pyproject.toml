[project]
name = "generator"
version = "0.1.0"
description = "Open-loop synthetic payment generator (PLAN.md §3.1)."
requires-python = ">=3.12"
dependencies = ["fraudcore", "confluent-kafka>=2.5", "orjson>=3.10", "polars>=1.0"]

[project.scripts]
generator = "generator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]

[tool.uv.sources]
fraudcore = { workspace = true }
