[project]
name = "profile_builder"
version = "0.1.0"
description = "Profile Builder: 30-day user profiles from the Parquet history into Redis (PLAN.md §3.4)."
requires-python = ">=3.12"
dependencies = ["fraudcore", "redis>=5", "polars>=1.0"]

[project.scripts]
profile_builder = "profile_builder.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_builder"]

[tool.uv.sources]
fraudcore = { workspace = true }
