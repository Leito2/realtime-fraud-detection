[project]
name = "feature_writer"
version = "0.1.0"
description = "Feature Writer: latest velocity state per user into Redis, off the critical path (PLAN.md §3.9)."
requires-python = ">=3.12"
dependencies = ["fraudcore", "confluent-kafka>=2.5", "redis>=5"]

[project.scripts]
feature_writer = "feature_writer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_writer"]

[tool.uv.sources]
fraudcore = { workspace = true }
