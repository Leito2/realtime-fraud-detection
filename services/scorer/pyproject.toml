[project]
name = "scorer"
version = "0.1.0"
description = "Scorer: Clean Architecture service (ADR-0002). Kafka consumer today; gRPC/REST entrypoints later."
requires-python = ">=3.12"
dependencies = ["fraudcore", "fraudproto", "grpcio>=1.66", "grpcio-health-checking>=1.66", "grpcio-reflection>=1.66", "psycopg[binary]>=3.2", "confluent-kafka>=2.5", "numpy>=1.26", "pyyaml>=6", "redis>=5", "onnxruntime>=1.19", "mlflow-skinny>=3.0", "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[project.scripts]
scorer = "scorer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorer"]

[tool.uv.sources]
fraudcore = { workspace = true }
fraudproto = { workspace = true }

# Dependency rule (ADR-0002): imports only point inward. Run: uv run lint-imports --config services/scorer/pyproject.toml
[tool.importlinter]
root_package = "scorer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "scorer.main",
    "scorer.sync_wiring",
    "scorer.config",
    "scorer.entrypoints | scorer.adapters",
    "scorer.application",
    "scorer.domain",
]

[[tool.importlinter.contracts]]
name = "Core knows no infrastructure"
type = "forbidden"
source_modules = ["scorer.application", "scorer.domain"]
forbidden_modules = ["redis", "confluent_kafka", "onnxruntime", "mlflow", "prometheus_client", "opentelemetry", "grpc", "psycopg", "fraud", "yaml", "fraudinfra"]
