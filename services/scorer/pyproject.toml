[project]
name = "scorer"
version = "0.1.0"
description = "Scorer: Clean Architecture service (ADR-0002). Kafka consumer today; gRPC/REST entrypoints later."
requires-python = ">=3.12"
dependencies = ["fraudcore", "confluent-kafka>=2.5", "numpy>=1.26", "pyyaml>=6"]

[project.scripts]
scorer = "scorer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorer"]

[tool.uv.sources]
fraudcore = { workspace = true }

# Dependency rule (ADR-0002): imports only point inward. Run: uv run lint-imports --config services/scorer/pyproject.toml
[tool.importlinter]
root_package = "scorer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "scorer.main",
    "scorer.config",
    "scorer.entrypoints | scorer.adapters",
    "scorer.application",
    "scorer.domain",
]

[[tool.importlinter.contracts]]
name = "Core knows no infrastructure"
type = "forbidden"
source_modules = ["scorer.application", "scorer.domain"]
forbidden_modules = ["redis", "confluent_kafka", "onnxruntime", "grpc", "yaml", "fraudinfra"]
