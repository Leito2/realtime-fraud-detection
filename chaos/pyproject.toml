[project]
name = "fraud-chaos"
version = "0.1.0"
description = "Failure injection with written hypotheses and a correctness verifier (PLAN.md section 7)."
requires-python = ">=3.12"
dependencies = ["fraudcore", "confluent-kafka>=2.5", "pyyaml>=6", "mlflow-skinny>=3.0", "fraud-bench"]

[project.scripts]
chaos = "fraud_chaos.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_chaos"]

[tool.uv.sources]
fraud-bench = { workspace = true }
fraudcore = { workspace = true }
