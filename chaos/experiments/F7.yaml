id: F7
title: MLflow is down and a corrupt model becomes champion
hypothesis: >-
  The scorer keeps serving the cached model while MLflow is down, refuses the corrupt version when MLflow
  returns, and the serving version does not change. Decisions never stop.
mechanism: On-disk model cache; the hot swap loads and validates a version before replacing the active one and remembers the rejected ones.
rate: 200
fault_at_s: 60
observe_s: 120
fault: { type: mlflow_corrupt, down_s: 60 }
expect:
  lost_max: 0
  gap_s_max: 5
  versions_unchanged: true
