id: F3
title: Redis is down
hypothesis: >-
  The scorer does not stop. While Redis is unreachable it decides with neutral profile values and the
  conservative thresholds, marks the decisions degraded, and nothing is lost.
mechanism: 5 ms Redis timeout in the profile store, ProfileUnavailable handled by the degraded policy (PLAN 7.4).
rate: 200
fault_at_s: 60
observe_s: 120
fault: { type: stop, service: redis, down_s: 30 }
expect:
  lost_max: 0
  gap_s_max: 5
  degraded_min: 0.15        # 30 s of 120 s observed is about 25% of the decisions after the fault
