id: F6
title: Poison pills in the payments topic
hypothesis: >-
  Malformed records written to the payments topic end up in the DLQ and the pipeline does not stop: valid
  payments keep flowing and none is lost.
mechanism: Schema validation at the edge (Flink reads the raw record; whatever is not a valid payment goes to the dlq topic).
rate: 400
fault_at_s: 60
observe_s: 90
fault: { type: poison, topic: payments, count: 500 }
expect:
  lost_max: 0
  gap_s_max: 5
  dlq_growth_min: 500
