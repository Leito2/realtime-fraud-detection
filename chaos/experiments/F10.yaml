id: F10
title: The Flink TaskManager dies with exactly-once
hypothesis: >-
  With a transactional sink (checkpoint every 1 s) and a consumer that reads committed data, killing the
  TaskManager loses no payment and produces no duplicate decision: Flink aborts the open transaction and replays
  from the last checkpoint, so the replayed rows are never visible twice. F1 (at-least-once) showed hundreds of
  duplicates. The price is latency: a row becomes visible only when its checkpoint commits.
mechanism: Kafka sink with delivery-guarantee exactly-once (two-phase commit tied to checkpoints) + isolation.level=read_committed in the scorer.
rate: 200
fault_at_s: 60
observe_s: 150
budget_ms: 3000
flink: { DELIVERY_GUARANTEE: exactly-once, CHECKPOINT_INTERVAL: "1 s" }
recreate: [scorer]
env: { KAFKA_ISOLATION_LEVEL: read_committed }
fault: { type: kill, service: taskmanager, restart_after_s: 3 }
expect:
  lost_max: 0
  duplicates_max: 0
  recovery_s_max: 90
