# Profiles (PLAN.md §8): core | ops | explain | chaos | train (+ full / serving-triton later).
# Usage: docker compose --profile core up -d      (or: make up PROFILE=core)
# Image tags: pin after M1's compatibility check (Flink ↔ Kafka connector).
x-core: &core
  profiles: ["core", "ops", "explain", "chaos"]

services:
  kafka:
    <<: *core
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports: ["9092:9092"]
    mem_limit: 850m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    <<: *core
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes: ["./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro"]
    restart: "no"

  jobmanager:
    <<: *core
    build: { context: ., dockerfile: docker/flink.Dockerfile }   # flink:2.0 + Kafka SQL connector 4.0.1-2.0
    image: fraud/flink:local
    command: jobmanager
    environment: { JOB_MANAGER_RPC_ADDRESS: jobmanager }
    ports: ["8081:8081"]
    volumes: ["flink-ckpt:/flink-checkpoints"]
    mem_limit: 850m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 5s
      retries: 20

  taskmanager:
    <<: *core
    image: fraud/flink:local
    command: taskmanager
    environment: { JOB_MANAGER_RPC_ADDRESS: jobmanager }
    depends_on:
      jobmanager: { condition: service_healthy }
    volumes: ["flink-ckpt:/flink-checkpoints"]
    mem_limit: 1250m

  # One-shot: submits the SQL job to the session cluster, then exits.
  flink-job:
    <<: *core
    image: fraud/flink:local
    depends_on:
      jobmanager: { condition: service_healthy }
      taskmanager: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }
    command: ["/opt/flink/submit-job.sh"]
    environment: { BUFFER_TIMEOUT: "${BUFFER_TIMEOUT:-}" }
    restart: "no"
    mem_limit: 500m

  redis:
    <<: *core
    image: redis:8
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    mem_limit: 200m

  prometheus:
    <<: *core
    image: prom/prometheus:v3.2.1
    volumes: ["./observability/prometheus:/etc/prometheus:ro"]      # prometheus.yml + slo_rules.yml
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
    ports: ["9090:9090"]
    mem_limit: 350m

  # Model registry: the scorer follows the `champion` alias here. Training registers models through it.
  mlflow:
    <<: *core
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    image: fraud/mlflow:local
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      retries: 30
    mem_limit: 500m

  kafka-exporter:
    <<: *core
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 64m

  redis-exporter:
    <<: *core
    image: oliver006/redis_exporter:v1.67.0
    environment: { REDIS_ADDR: "redis://redis:6379" }
    mem_limit: 48m

  # Optional tracing (profile `trace`): make trace-up. The scorer exports spans when OTEL_EXPORTER_OTLP_ENDPOINT is set.
  otel-collector:
    profiles: ["trace"]
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    mem_limit: 160m

  tempo:
    profiles: ["trace"]
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["3200:3200"]
    mem_limit: 256m

  postgres:
    profiles: ["ops", "explain", "chaos"]
    image: postgres:17
    environment: { POSTGRES_DB: fraud, POSTGRES_USER: fraud, POSTGRES_PASSWORD: fraud }
    volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["5432:5432"]
    mem_limit: 250m

  grafana:
    profiles: ["ops", "explain"]
    image: grafana/grafana:11.6.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    mem_limit: 256m

  llm-gateway:
    profiles: ["explain"]
    build: ../llm-gateway              # P0 — shared Python gateway
    env_file: ../llm-gateway/.env.example
    environment: { GW_REDIS_URL: "redis://redis:6379/1" }
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 700m   # semantic cache + guardrails ONNX models (P0 v2)

  # App services (PLAN.md §11), added milestone by milestone from one image: docker/app.Dockerfile.
  scorer:
    <<: *core
    build: { context: ., dockerfile: docker/app.Dockerfile }
    image: fraud/app:local
    command: ["scorer"]
    environment:
      BOOTSTRAP: "kafka:29092"
      CONFIG_DIR: /app/config
      REDIS_URL: "redis://redis:6379/0"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"      # set by `make trace-up`
      BATCH_MAX_MESSAGES: "${BATCH_MAX_MESSAGES:-}"      # experiment E2 overrides config/scorer.yaml
      BATCH_MAX_WAIT_MS: "${BATCH_MAX_WAIT_MS:-}"
      LOG_FEATURES: "${LOG_FEATURES:-}"      # 1: decisions carry the served features (feedback dataset)
      MODEL_CACHE_DIR: /cache            # last downloaded models: the scorer survives MLflow being down (F7)
    volumes: ["./config:/app/config:ro", "model-cache:/cache"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 300m

  feature-writer:
    <<: *core
    image: fraud/app:local
    entrypoint: ["feature_writer"]
    environment: { BOOTSTRAP: "kafka:29092", REDIS_URL: "redis://redis:6379/0" }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 150m

  # Shadow challenger (PLAN.md §3.8): same input, own consumer group, publishes to shadow-scores only.
  scorer-shadow:
    profiles: ["ops"]
    image: fraud/app:local
    command: ["scorer", "--mode", "shadow"]
    environment:
      BOOTSTRAP: "kafka:29092"
      CONFIG_DIR: /app/config
      REDIS_URL: "redis://redis:6379/0"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MODEL_CACHE_DIR: /cache-shadow
    volumes: ["./config:/app/config:ro", "model-cache-shadow:/cache-shadow"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 300m

  auditor:
    profiles: ["ops"]
    image: fraud/app:local
    entrypoint: ["auditor"]
    environment:
      BOOTSTRAP: "kafka:29092"
      POSTGRES_DSN: "postgresql://fraud:fraud@postgres:5432/fraud"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_started }
    restart: unless-stopped
    mem_limit: 150m

  # Run-to-completion tools: docker compose --profile tools run --rm generator --rate 2000 --duration 30
  generator:
    profiles: ["tools"]
    image: fraud/app:local
    entrypoint: ["generator"]
    environment: { BOOTSTRAP: "kafka:29092" }
    volumes: ["./data:/data"]
    mem_limit: 1g

  profile-builder:
    profiles: ["tools"]
    image: fraud/app:local
    entrypoint: ["profile_builder"]
    environment: { REDIS_URL: "redis://redis:6379/0" }
    volumes: ["./data:/data:ro"]
    mem_limit: 1g

  latency:
    profiles: ["tools"]
    image: fraud/app:local
    entrypoint: ["latency"]
    environment: { BOOTSTRAP: "kafka:29092" }
    mem_limit: 200m

volumes:
  flink-ckpt: {}
  mlflow-data: {}
  tempo-data: {}
  model-cache: {}
  model-cache-shadow: {}
