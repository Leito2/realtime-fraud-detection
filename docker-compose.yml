# Profiles (PLAN.md §8): core | ops | explain | chaos | train (+ full / serving-triton later).
# Usage: docker compose --profile core up -d      (or: make up PROFILE=core)
# Image tags: pin after M1's compatibility check (Flink ↔ Kafka connector).
x-core: &core
  profiles: ["core", "ops", "explain", "chaos"]

services:
  kafka:
    <<: *core
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports: ["9092:9092"]
    mem_limit: 850m

  kafka-init:
    <<: *core
    image: apache/kafka:3.9.0
    depends_on: [kafka]
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes: ["./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro"]
    restart: "no"

  jobmanager:
    <<: *core
    image: flink:2.0-java17          # verify tag + matching Kafka SQL connector JAR in M1
    command: jobmanager
    ports: ["8081:8081"]
    volumes: ["./flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro", "flink-ckpt:/flink-checkpoints"]
    mem_limit: 650m

  taskmanager:
    <<: *core
    image: flink:2.0-java17
    command: taskmanager
    depends_on: [jobmanager]
    volumes: ["./flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro", "flink-ckpt:/flink-checkpoints"]
    mem_limit: 1250m

  redis:
    <<: *core
    image: redis:8
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    mem_limit: 200m

  prometheus:
    <<: *core
    image: prom/prometheus:latest      # pin in M5
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
    ports: ["9090:9090"]
    mem_limit: 350m

  postgres:
    profiles: ["ops", "explain", "chaos"]
    image: postgres:17
    environment: { POSTGRES_DB: fraud, POSTGRES_USER: fraud, POSTGRES_PASSWORD: fraud }
    volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["5432:5432"]
    mem_limit: 250m

  grafana:
    profiles: ["ops", "explain"]
    image: grafana/grafana:latest      # pin in M5
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    mem_limit: 150m

  llm-gateway:
    profiles: ["explain"]
    build: ../llm-gateway              # P0 — shared Python gateway
    env_file: ../llm-gateway/.env.example
    environment: { GW_REDIS_URL: "redis://redis:6379/1" }
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 700m   # semantic cache + guardrails ONNX models (P0 v2)

  # App services (generator, scorer, api, feature_writer, auditor, explainer, latency) are added
  # milestone by milestone (PLAN.md §11) from a single image: docker/app.Dockerfile.

volumes:
  flink-ckpt: {}
