[project]
name = "fraud-bench"
version = "0.1.0"
description = "Open-loop load protocol, run manifests and result reports (PLAN.md section 5)."
requires-python = ">=3.12"
dependencies = ["confluent-kafka>=2.5", "pyyaml>=6"]

[project.scripts]
bench = "fraud_bench.run:main"
bench-report = "fraud_bench.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_bench"]
