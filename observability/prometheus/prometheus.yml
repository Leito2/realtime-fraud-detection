global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/slo_rules.yml
scrape_configs:
  - job_name: flink
    static_configs: [{ targets: ["jobmanager:9249", "taskmanager:9249"] }]
  - job_name: kafka-exporter
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: redis-exporter
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: scorer
    static_configs: [{ targets: ["scorer:9100"] }]
  - job_name: scorer-shadow
    static_configs: [{ targets: ["scorer-shadow:9101"] }]
