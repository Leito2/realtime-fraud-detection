global:
  scrape_interval: 5s
scrape_configs:
  - job_name: flink
    static_configs: [{ targets: ["jobmanager:9249", "taskmanager:9249"] }]
  - job_name: kafka-exporter
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: redis-exporter
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: scorer
    static_configs: [{ targets: ["scorer:9100"] }]
