apiVersion: 1
datasources:
  - { name: Tempo, uid: tempo, type: tempo, url: "http://tempo:3200" }
  - { name: Prometheus, uid: prom, type: prometheus, url: "http://prometheus:9090", isDefault: true, jsonData: { timeInterval: 5s } }
  - name: Audit store
    uid: pg
    type: grafana-postgresql-datasource
    url: "postgres:5432"
    user: fraud
    secureJsonData: { password: fraud }
    jsonData: { database: fraud, sslmode: disable, postgresVersion: 1700 }
