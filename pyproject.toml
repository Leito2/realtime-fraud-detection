[project]
name = "realtime-fraud-detection"
version = "0.1.0"
description = "Real-time fraud detection: Kafka + Flink SQL + Redis + XGBoost/ONNX, measured end to end."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fraudcore"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/generator", "services/scorer", "services/latency", "services/profile_builder", "services/feature_writer", "services/auditor", "training", "bench"]

[tool.uv.sources]
fraudcore = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "grpcio-tools>=1.66", "import-linter>=2.0", "onnx>=1.16"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fraudcore"]

[tool.pytest.ini_options]
markers = ["integration: needs the docker stack (make up); skipped when it is not running"]
testpaths = ["packages/fraudcore/tests", "services", "training", "tests"]
addopts = "--import-mode=importlib"
